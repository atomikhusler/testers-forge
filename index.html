<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Testers Forge</title>
    <style>
        :root {
            --bg-base: #07090E;
            --bg-surface: #11141D;
            --bg-surface-alt: #1A1E2C;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --accent-cyan: #00E5FF;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --border-dim: #23283B;
            --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --sidebar-width: 320px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            display: flex;
            height: 100vh; height: 100dvh; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 5px; }

        /* --- 3-ZONE SIDEBAR --- */
        aside {
            width: var(--sidebar-width); background: var(--bg-surface);
            border-right: 1px solid var(--border-dim);
            display: flex; flex-direction: column;
            transition: transform 0.3s ease; z-index: 100;
            padding-top: env(safe-area-inset-top);
        }

        /* Zone A: Sticky Top & Accordion */
        .sidebar-zone-a { border-bottom: 1px solid var(--border-dim); background: var(--bg-surface); }
        .brand-logo { padding: 20px; font-weight: 800; font-size: 1.4rem; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-dim); }
        .brand-logo span { color: var(--accent-cyan); }
        .close-sidebar { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.8rem; cursor: pointer; }
        
        /* Accordion Header & Hint */
        .meta-accordion-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--bg-surface-alt); transition: 0.2s; user-select: none; }
        .meta-accordion-header:hover { background: var(--bg-base); }
        .meta-summary { font-size: 0.75rem; color: var(--accent-cyan); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 10px; }
        
        @keyframes pulseHint {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        .pulse-hint { font-size: 0.65rem; color: var(--text-secondary); margin-right: 8px; animation: pulseHint 2s infinite ease-in-out; opacity: 0; display: none; transition: 0.3s;}
        .pulse-hint.visible { display: inline-block; opacity: 1; }
        
        .meta-chevron { font-size: 0.7rem; color: var(--text-secondary); transition: transform 0.3s ease; }
        .meta-chevron.collapsed { transform: rotate(-90deg); }

        .sidebar-meta { padding: 15px 20px; background: var(--bg-base); display: block; border-top: 1px solid var(--border-dim); }
        .sidebar-meta label { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .sidebar-meta input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-dim); color: var(--text-primary); padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 12px; outline: none; transition: 0.2s; }
        .sidebar-meta input:focus { border-color: var(--accent-cyan); }

        /* Sidebar Edit Toolbar */
        .sidebar-toolbar { padding: 10px 20px; border-top: 1px solid var(--border-dim); background: var(--bg-surface-alt); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-toolbar span { font-size: 0.8rem; font-weight: bold; color: var(--text-secondary); }

        /* Zone B: Scrollable Menu */
        .sidebar-zone-b { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column; }
        .nav-item { padding: 12px 20px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .nav-item:hover { background: var(--bg-surface-alt); color: var(--text-primary); border-left: 3px solid var(--accent-cyan); }
        .nav-title { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .sec-controls { display: none; gap: 5px; align-items: center; }
        .sec-btn { background: var(--bg-base); border: 1px solid var(--border-dim); color: var(--text-primary); border-radius: 4px; padding: 4px 6px; font-size: 0.75rem; cursor: pointer;}
        .sec-btn:hover { background: var(--accent-cyan); color: var(--bg-base); border-color: var(--accent-cyan); }
        .sec-btn.del:hover { background: var(--accent-red); border-color: var(--accent-red); }
        
        .add-sec-area { display: none; padding: 15px 20px; flex-direction: column; gap: 8px; background: rgba(0, 229, 255, 0.05); border-bottom: 1px solid var(--border-dim); }
        .add-sec-row { display: flex; gap: 8px; }
        .add-sec-area input { background: var(--bg-base); border: 1px dashed var(--border-dim); color: var(--text-primary); padding: 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        .add-sec-area input:focus { border-color: var(--accent-cyan); }
        .btn-add-sec { background: var(--accent-cyan); color: var(--bg-base); border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Zone C: Sticky Footer (Horizontal Buttons) */
        .sidebar-zone-c { border-top: 1px solid var(--border-dim); background: var(--bg-surface); padding-bottom: env(safe-area-inset-bottom); display: flex; flex-direction: column;}
        .global-actions { padding: 15px 20px; display: flex; flex-direction: row; gap: 10px; border-bottom: 1px solid var(--border-dim); }
        .global-btn { flex: 1; padding: 10px 5px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; cursor: pointer; text-align: center; transition: 0.2s; border: 1px solid; white-space: nowrap;}
        .btn-clear { background: var(--bg-base); color: var(--text-primary); border-color: var(--border-dim); }
        .btn-clear:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-reset { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3); }
        .btn-reset:hover { background: var(--accent-red); color: var(--text-primary); }
        
        .sidebar-branding { padding: 15px 20px; text-align: center; font-size: 0.7rem; color: var(--text-secondary); background: var(--bg-base); }
        .brand-name { color: var(--accent-cyan); font-weight: bold; }

        .edit-sidebar-active .sec-controls { display: flex; }
        .edit-sidebar-active .add-sec-area { display: flex; }

        /* --- MAIN WORKSPACE --- */
        main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-base); }

        /* Initial Toast Nudge  */
        .init-toast {
            position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            background: rgba(17, 20, 29, 0.95); border: 1px solid var(--accent-cyan);
            color: var(--text-primary); padding: 12px 24px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0, 229, 255, 0.2);
            z-index: 1000; transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            white-space: normal;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .init-toast.toast-hidden { opacity: 0; transform: translate(-50%, 20px); }
        .init-toast span { color: var(--accent-cyan); }

        .super-header { width: 100%; text-align: center; padding: 6px; font-size: 0.65rem; color: var(--text-secondary); background: #040508; border-bottom: 1px solid var(--border-dim); letter-spacing: 0.5px; padding-top: max(6px, env(safe-area-inset-top)); }
        .super-header span { font-weight: bold; color: var(--text-primary); }
        @keyframes heartbeat { 0%, 28%, 70% { transform: scale(1); } 14%, 42% { transform: scale(1.3); } }
        .heart { display: inline-block; animation: heartbeat 1.5s infinite; color: var(--accent-red); font-size: 0.75rem; margin: 0 2px;}
        
        .top-bar { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .main-title { font-weight: 800; font-size: 1.1rem; color: var(--text-primary); display: flex; align-items: center; gap: 15px;}
        .hamburger { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; display: none; cursor: pointer;}
        
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .stats { font-size: 0.8rem; font-weight: 600; display: flex; gap: 12px; }
        .pass-text { color: var(--accent-green); }
        .fail-text { color: var(--accent-red); }
        
        .btn-edit { background: var(--bg-surface-alt); border: 1px solid var(--border-dim); color: var(--text-primary); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
        .btn-edit.active { background: var(--accent-cyan); color: var(--bg-base); border-color: var(--accent-cyan); }

        .content-scroll { flex: 1; overflow-y: auto; padding: 30px 40px; scroll-behavior: smooth; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }

        .section-block { margin-bottom: 40px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: var(--text-primary); border-bottom: 1px solid var(--border-dim); padding-bottom: 10px;}
        
        .test-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); border: 1px solid var(--border-dim); padding: 12px 18px; border-radius: 8px; margin-bottom: 8px; }
        .test-text { flex: 1; font-size: 0.9rem; line-height: 1.4; padding-right: 15px;}

        .toggle-group { display: flex; gap: 12px; align-items: center; }
        .circle-btn { width: 28px; height: 28px; border-radius: 50%; background: transparent; cursor: pointer; transition: all 0.2s ease; }
        .btn-pass { border: 2px solid #234D35; }
        .btn-pass.active { background: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-fail { border: 2px solid #4D232F; }
        .btn-fail.active { background: var(--accent-red); border-color: var(--accent-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        .edit-control { display: none; }
        .edit-main-active .edit-control { display: flex; }
        .edit-main-active .toggle-group { display: none; }
        
        .btn-delete { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; opacity: 0.8;}
        .add-row { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        .add-row input { flex: 1; background: var(--bg-surface); border: 1px dashed var(--border-dim); color: var(--text-primary); padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none;}
        .btn-add { background: var(--bg-surface-alt); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;}

        /* Export Zone */
        .export-zone { margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--border-dim); }
        textarea { width: 100%; height: 100px; background: var(--bg-surface); border: 1px solid var(--border-dim); color: var(--text-primary); padding: 15px; border-radius: 8px; outline: none; margin-bottom: 15px; resize: vertical;}
        .file-upload-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;}
        input[type="file"] { display: none; }
        .file-label { background: var(--bg-surface-alt); border: 1px dashed var(--border-dim); color: var(--text-secondary); padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s;}
        .file-label:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .log-preview { font-family: monospace; font-size: 0.8rem; color: var(--accent-cyan);}
        .btn-export { width: 100%; background: var(--text-primary); color: var(--bg-base); border: none; padding: 16px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer;}
        #export-code { display: none; height: 150px; background: #000; margin-top: 20px; font-family: monospace;}

        @media (max-width: 800px) {
            aside { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
            aside.open { transform: translateX(0); }
            .hamburger, .close-sidebar { display: block; }
            .main-title span { display: none; } 
            .header-actions { gap: 10px; flex-direction: column-reverse; align-items: flex-end; justify-content: center;}
            .top-bar { height: 85px; } 
            .content-scroll { padding: 20px 15px; padding-bottom: 120px; }
            .add-sec-row { flex-direction: column; }
            .add-sec-area input { width: 100%; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-zone-a">
            <div class="brand-logo"><div>TESTERS<span>FORGE</span></div><button class="close-sidebar" onclick="toggleSidebar()">×</button></div>
            
            <div class="meta-accordion-header" onclick="toggleMetaAccordion()">
                <div class="meta-summary" id="meta-summary">👤 Session Profile...</div>
                <div class="pulse-hint" id="pulse-hint">(Tap to hide ↑)</div>
                <div class="meta-chevron" id="meta-chevron">▼</div>
            </div>

            <div class="sidebar-meta" id="meta-panel">
                <label>Date</label><input type="date" id="meta-date">
                <label>Tester Name</label><input type="text" id="meta-tester" placeholder="e.g., atomikhusler">
                <label>Device Codename</label><input type="text" id="meta-device" placeholder="e.g., spes">
                <label>ROM & Version</label><input type="text" id="meta-rom" placeholder="e.g., crDroid 12.10">
            </div>

            <div class="sidebar-toolbar">
                <span>CATEGORIES</span>
                <button class="btn-edit" id="btn-edit-sidebar" onclick="toggleSidebarEdit()">⚙️ Edit Sections</button>
            </div>
        </div>

        <div class="sidebar-zone-b" id="sidebar-scroll">
            <div id="nav-container"></div>
            <div class="add-sec-area">
                <div class="add-sec-row">
                    <input type="text" id="new-sec-icon" style="width: 50px;" placeholder="Icon 🚀" maxlength="2">
                    <input type="text" id="new-sec-title" style="flex:1;" placeholder="New Section Name...">
                </div>
                <button class="btn-add-sec" onclick="addSection()">+ Add Category</button>
            </div>
        </div>

        <div class="sidebar-zone-c">
            <div class="global-actions">
                <button class="global-btn btn-clear" onclick="clearSelections()">🔄 Clear</button>
                <button class="global-btn btn-reset" onclick="factoryReset()">⚠️ Reset</button>
            </div>
            <div class="sidebar-branding">
                made with <span class="heart">❤️</span> &lt;/&gt; by <span class="brand-name">atomikhusler [ spesium ]</span>
            </div>
        </div>
    </aside>

    <main>
        <div class="super-header"><span>TESTERS FORGE</span> • made with <span class="heart">❤️</span> &lt;/&gt; by atomikhusler [ spesium ]</div>

        <div class="top-bar">
            <div class="main-title"><button class="hamburger" onclick="toggleSidebar()">☰</button><span style="font-size: 1rem;">DASHBOARD</span></div>
            <div class="header-actions">
                <div class="stats" id="stats-display"><span>0/0</span></div>
                <button class="btn-edit" id="btn-edit-main" onclick="toggleMainEdit()">✏️ Edit Tests</button>
            </div>
        </div>

        <div class="content-scroll" id="main-scroll">
            <div id="checklist-container"></div>
            <div class="export-zone" id="sec-export">
                <textarea id="meta-remarks" placeholder="Add specific bug notes, thermal observations, or context here..."></textarea>
                <div class="file-upload-wrapper">
                    <label for="log-upload" class="file-label">📎 Attach Logcat (.txt)</label>
                    <input type="file" id="log-upload" accept=".txt, .log">
                    <span class="log-preview" id="log-preview-text"></span>
                </div>
                <button class="btn-export" onclick="generateReport()">🚀 GENERATE REPORT</button>
                <textarea id="export-code" readonly></textarea>
            </div>
        </div>
        
        <div class="init-toast toast-hidden" id="init-toast">
            <span>Forge Initialized</span> • Please configure your Session Profile in Menu to begin.
        </div>
    </main>

    <script src="checklist.js"></script>
    <script src="engine.js"></script>
</body>
</html>
